<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
  <meta name="theme-color" content="#0e0f1a">
  <title>RPG Química — Campus Periodicum</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="hud" id="hud" aria-label="Informações do jogo">
    <span class="badge">Santuários: <span id="done">0</span>/<span id="total">6</span></span>
    <span class="badge research-badge"><span id="rank">Visitante do Laboratório</span> · <span id="rp">0</span> PR</span>
    <span class="badge objective-badge" id="objective">Fale com o Prof. Dalton</span>
    <button class="badge btn hud-btn" id="muteBtn" type="button" aria-label="Ativar ou desativar efeitos sonoros">🔊 FX</button>
    <button class="badge btn hud-btn" id="fsBtn" type="button">⤢ Tela Cheia</button>
    <button class="badge btn hud-btn" id="testBtn" type="button">🧪 Testes</button>
  </header>

  <main id="wrap">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Campus Periodicum, jogo educacional de química"></canvas>
  </main>

  <div id="toastArea" class="toast-area" role="status" aria-live="polite"></div>

  <section class="panel" id="ui" aria-modal="true" role="dialog" aria-labelledby="panelTitle">
    <div class="card" id="uicard">
      <div id="uicontent"></div>
      <div class="foot panel-foot">
        <button class="btn" id="closeBtn" type="button">Fechar (Esc)</button>
      </div>
    </div>
  </section>

  <nav class="touch-ui" id="touchUi" aria-label="Controles por toque">
    <div class="touch-dpad">
      <button id="touchUp" class="touch-key up" type="button" aria-label="Mover para cima" data-move="arrowup">▲</button>
      <button id="touchLeft" class="touch-key left" type="button" aria-label="Mover para a esquerda" data-move="arrowleft">◀</button>
      <button id="touchDown" class="touch-key down" type="button" aria-label="Mover para baixo" data-move="arrowdown">▼</button>
      <button id="touchRight" class="touch-key right" type="button" aria-label="Mover para a direita" data-move="arrowright">▶</button>
    </div>
    <div class="touch-actions">
      <button id="touchInteract" class="touch-key action" type="button" data-action="interact">E</button>
      <button id="touchScan" class="touch-key action" type="button" data-action="scan">Q</button>
      <button id="touchInventory" class="touch-key small-action" type="button" data-action="inventory">I</button>
      <button id="touchMissions" class="touch-key small-action" type="button" data-action="missions">J</button>
      <button id="touchMap" class="touch-key small-action" type="button" data-action="map">M</button>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
