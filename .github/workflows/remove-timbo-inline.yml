name: Remove inline audio
on:
  push:
    paths: ['.github/workflows/remove-timbo-inline.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove inline audio blobs
        run: python3 tools/remove-timbo-inline.py
      - name: Commit HTML without embedded audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Timbo-Speaker/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Move Timbó inline audio into private Supabase Storage"
            git push
          fi
