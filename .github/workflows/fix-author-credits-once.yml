name: Corrigir créditos autorais

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-author-credits-once.yml'

permissions:
  contents: write

jobs:
  fix-credits:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir créditos e remover rotina temporária
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          author = 'Lucas Xavier Nardelli'
          ignored_dirs = {'.git', 'node_modules', 'dist', 'build'}
          text_extensions = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx',
              '.css', '.md', '.txt', '.json', '.xml', '.yml', '.yaml',
              '.java', '.kt', '.gradle', '.properties', '.py', '.ps1', '.sh'
          }

          patterns = [
              re.compile(r'(?i)(direção\s+criativa\s+e\s+conceito\s*:\s*)timb[oó]'),
              re.compile(r'(?i)((?:criado|desenvolvido|idealizado|produzido|dirigido)\s+por\s+)timb[oó]'),
              re.compile(r'(?i)((?:autor(?:ia)?|créditos?|creator|created\s+by|developed\s+by|creative\s+direction|direction)\s*[:\-]\s*)timb[oó]'),
              re.compile(r'(?i)(©\s*)timb[oó]'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for pattern in patterns:
                  updated = pattern.sub(lambda match: f'{match.group(1)}{author}', updated)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          wonder_index = root / 'Wonder World' / 'index.html'
          if wonder_index.exists():
              original = wonder_index.read_text(encoding='utf-8')
              updated = re.sub(r'\s*<script\s+src=["\']\./credit-fix\.js["\']></script>\s*', '\n', original)
              if updated != original:
                  wonder_index.write_text(updated, encoding='utf-8')
                  changed.append(str(wonder_index))

          temporary_fix = root / 'Wonder World' / 'credit-fix.js'
          if temporary_fix.exists():
              temporary_fix.unlink()
              changed.append(str(temporary_fix))

          workflow = root / '.github' / 'workflows' / 'fix-author-credits-once.yml'
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow))

          print('Arquivos alterados:')
          for item in changed:
              print(f'- {item}')

      - name: Publicar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Atualiza créditos autorais para Lucas Xavier Nardelli"
          git push
