<body>
  <!-- Gradientes botânicos compartilhados -->
  <svg id="plant-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="petal-vermelha" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#881337"/><stop offset=".48" stop-color="#E11D48"/><stop offset="1" stop-color="#FB7185"/>
      </radialGradient>
      <radialGradient id="petalDark-vermelha" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#4C0519"/><stop offset="1" stop-color="#BE123C"/>
      </radialGradient>
      <radialGradient id="petal-rosa" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#BE185D"/><stop offset=".5" stop-color="#F472B6"/><stop offset="1" stop-color="#FBCFE8"/>
      </radialGradient>
      <radialGradient id="petalDark-rosa" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#9D174D"/><stop offset="1" stop-color="#EC4899"/>
      </radialGradient>
      <radialGradient id="petal-branca" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#CBD5E1"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFFFFF"/>
      </radialGradient>
      <radialGradient id="petalDark-branca" cx="50%" cy="95%" r="95%">
        <stop offset="0" stop-color="#94A3B8"/><stop offset="1" stop-color="#E2E8F0"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#FEF9C3"/><stop offset=".6" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/>
      </radialGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
      </linearGradient>
      <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#065F46"/><stop offset=".5" stop-color="#10B981"/><stop offset="1" stop-color="#065F46"/>
      </linearGradient>
      <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6B3A22"/><stop offset=".45" stop-color="#9A5937"/><stop offset="1" stop-color="#572E1A"/>
      </linearGradient>
      <linearGradient id="potRimGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#B06B46"/><stop offset="1" stop-color="#743E24"/>
      </linearGradient>
      <radialGradient id="bioHalo">
        <stop offset="0" stop-color="#F6DF9A" stop-opacity=".78"/>
        <stop offset=".5" stop-color="#2FA37C" stop-opacity=".28"/>
        <stop offset="1" stop-color="#D8B16A" stop-opacity="0"/>
      </radialGradient>
      <filter id="bioGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
        <feFlood flood-color="#E5C175" flood-opacity=".86"/>
        <feComposite in2="blur" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bioGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="1.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <div class="backdrop" aria-hidden="true"></div>

  <!-- Controles flutuantes minimalistas (sem barra de menu pesada nem banner) -->
