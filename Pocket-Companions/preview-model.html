<!doctype html><html><head><meta charset='utf-8'><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee}canvas{display:block}</style></head><body><canvas id='c'></canvas><script type='module'>
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
const q=new URLSearchParams(location.search); const model=q.get('model');
const canvas=document.querySelector('#c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.setClearColor(0xf0eee9,1); renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,100); scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5)); const dl=new THREE.DirectionalLight(0xffffff,3); dl.position.set(-4,7,5); scene.add(dl); const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0xdcd8d0,roughness:1})); floor.rotation.x=-Math.PI/2; floor.position.y=0; scene.add(floor);
new GLTFLoader().load('./assets/models/'+model,g=>{const o=g.scene;o.traverse(x=>{if(x.isMesh){x.castShadow=true;x.receiveShadow=true}}); scene.add(o); let b=new THREE.Box3().setFromObject(o), sz=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3()); const sc=2/Math.max(sz.x,sz.y,sz.z); o.scale.setScalar(sc); o.updateMatrixWorld(true); b=new THREE.Box3().setFromObject(o); c=b.getCenter(new THREE.Vector3()); o.position.sub(c); o.position.y-=b.min.y; o.rotation.y=-0.45; o.updateMatrixWorld(true); b=new THREE.Box3().setFromObject(o); sz=b.getSize(new THREE.Vector3()); camera.position.set(3.8,Math.max(1.6,sz.y*.75),5.5); camera.lookAt(0,sz.y*.52,0); renderer.render(scene,camera); document.body.dataset.ready='1';},undefined,e=>{document.body.innerText=e;});
function loop(){renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
</script></body></html>
