<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CitoLab 3D — Laboratório Virtual</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/theme.css?v=14">
<link rel="stylesheet" href="css/layout.css?v=14">
<link rel="stylesheet" href="css/microscope.css?v=19">
<script type="importmap">{"imports":{"three":"./libs/three.module.js","three/addons/":"./libs/"}}</script>
</head>
<body>
<header class="topbar">
  <a href="#citologia" class="brand" aria-label="CitoLab 3D, início">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
        <polygon points="12 2.5 20.2 7.25 20.2 16.75 12 21.5 3.8 16.75 3.8 7.25"/>
        <circle cx="12" cy="12" r="3.4"/>
      </svg>
    </span>
    <span>CitoLab <b>3D</b><small>LABORATÓRIO VIRTUAL</small></span>
  </a>
  <nav aria-label="Módulos do laboratório" id="navigation"></nav>
  <div class="topbar-actions">
    <button id="toggle-labels" class="quiet" type="button" aria-pressed="false">Ocultar rótulos</button>
    <button id="sound" class="quiet" type="button" aria-pressed="true">Som desligado</button>
    <button id="open-panel" class="quiet" type="button" aria-expanded="true" aria-controls="guide">Recolher painel</button>
  </div>
</header>
<main class="workspace" id="workspace">
  <section class="experiment" aria-labelledby="scene-title">
    <div id="viewport" class="viewport">
      <div id="stage" class="stage"></div>
      <div id="projection" class="projection" aria-hidden="true"></div>
      <div id="overlay" class="overlay"></div>
      <header class="scene-heading">
        <p id="scene-kicker" class="eyebrow"></p>
        <h1 id="scene-title">CitoLab 3D</h1>
        <p id="scene-subtitle">Laboratório Virtual de Citologia, Bioquímica e Histologia</p>
        <div class="view-help" id="view-help">Arraste para orbitar · Role para aproximar</div>
      </header>
      <div id="tooltip" class="tooltip" hidden></div>
      <div class="scene-error" id="scene-error" role="alert" hidden></div>
    </div>
    <div class="bottom-dock" id="bottom-dock">
      <div class="toolbar" id="toolbar" aria-label="Controles da cena"></div>
    </div>
  </section>
  <aside class="guide" id="guide" aria-label="Painel didático">
    <div class="guide-top">
      <span class="eyebrow">CADERNO DE LABORATÓRIO</span>
      <span class="live-dot" aria-hidden="true"></span>
    </div>
    <div id="guide-body"></div>
  </aside>
</main>
<footer>
  <span>CitoLab 3D</span>
  <span>Citologia · Metabolismo · DNA/RNA · Divisão Celular · Histologia · Óptico · Eletrônico</span>
  <span class="footer-local"><i></i> Bancada ativa</span>
</footer>
<script type="module" src="js/main.js?v=22"></script>
</body>
</html>
